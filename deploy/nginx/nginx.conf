# Nginx 配置 for llm-proxy
# 用途：反向代理、TLS 终止、限流、防护

# ======================
# 全局配置
# ======================
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式（包含后端响应时间）
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # 隐藏 Nginx 版本
    server_tokens off;

    # ======================
    # 限流配置
    # ======================
    # 按 IP 限流：每秒 10 个请求
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # 全局限流：每秒 100 个请求
    limit_req_zone $server_name zone=global_limit:10m rate=100r/s;

    # IP 黑白名单
    geo $block_ip {
        default 0;
        # 1.2.3.4/32 1;  # 示例：黑名单 IP
    }

    # User-Agent 验证（宽松模式，允许常见客户端）
    map $http_user_agent $valid_ua {
        default                         1;  # 默认允许（Nginx if 不安全，改用默认允许）
        ""                              0;  # 空 UA 拒绝
    }

    # ======================
    # HTTPS 服务器
    # ======================
    server {
        listen 443 ssl http2;
        server_name your-domain.com;  # TODO: 替换为你的域名

        # SSL 证书配置
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # TLS 配置（现代浏览器兼容）
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # OCSP Stapling（提升 TLS 握手性能）
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # 安全头部
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ======================
        # 主代理路径
        # ======================
        location / {
            # 限流
            limit_req zone=api_limit burst=20 nodelay;
            limit_req zone=global_limit burst=100;

            # User-Agent 验证（使用 map 代替 if）
            if ($valid_ua = 0) {
                return 403;
            }

            # 代理设置
            proxy_pass http://llm-proxy:8080;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # 缓冲设置
            proxy_buffering off;
            proxy_cache off;

            # 隐藏后端头部
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;
        }

        # ======================
        # WebSocket 支持
        # ======================
        location /ws {
            # 限流（WebSocket 连接较少）
            limit_req zone=api_limit burst=5 nodelay;

            # User-Agent 验证
            if ($valid_ua = 0) {
                return 403;
            }

            proxy_pass http://llm-proxy:8080;
            proxy_http_version 1.1;

            # WebSocket 升级
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 长超时（WebSocket 长连接）
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # 关闭缓冲
            proxy_buffering off;
            proxy_cache off;
        }

        # ======================
        # 健康检查端点（公开）
        # ======================
        location /health {
            access_log off;
            proxy_pass http://llm-proxy:8080/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ======================
        # 伪装路径（迷惑检测）
        # ======================
        location /static/ {
            alias /var/www/html/static/;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        location /about {
            default_type text/plain;
            return 200 'About This Site\n\nThis is a normal website running standard web services.\n';
        }

        location /robots.txt {
            default_type text/plain;
            return 200 'User-agent: *\nDisallow:\n';
        }

        # ======================
        # 自定义错误页面
        # ======================
        error_page 400 /400.html;
        error_page 403 /403.html;
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /400.html {
            internal;
            default_type text/html;
            return 400 '<!DOCTYPE html><html><head><title>400 Bad Request</title></head><body><h1>400 Bad Request</h1></body></html>';
        }

        location = /403.html {
            internal;
            default_type text/html;
            return 403 '<!DOCTYPE html><html><head><title>403 Forbidden</title></head><body><h1>403 Forbidden</h1></body></html>';
        }

        location = /404.html {
            internal;
            default_type text/html;
            return 404 '<!DOCTYPE html><html><head><title>404 Not Found</title></head><body><h1>404 Not Found</h1></body></html>';
        }

        location = /50x.html {
            internal;
            default_type text/html;
            return 500 '<!DOCTYPE html><html><head><title>Server Error</title></head><body><h1>Server Error</h1></body></html>';
        }
    }

    # ======================
    # HTTP 重定向到 HTTPS
    # ======================
    server {
        listen 80;
        server_name your-domain.com;  # TODO: 替换为你的域名

        # 重定向到 HTTPS
        return 301 https://$server_name$request_uri;
    }
}
