name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  # 构建 proxy 和 ws-client 二进制文件
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # Linux - AMD64 + ARM64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          # macOS - AMD64 + ARM64 (Apple Silicon)
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          # Windows - AMD64 + ARM64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build proxy binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
        run: |
          BINARY_NAME=proxy
          if [ "${{ matrix.os }}" = "windows" ]; then
            BINARY_NAME=proxy.exe
          fi
          go build -ldflags="-s -w -X main.Version=${VERSION}" -o ${BINARY_NAME} ./cmd/proxy

      - name: Build ws-client binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
        run: |
          CLIENT_NAME=ws-client
          if [ "${{ matrix.os }}" = "windows" ]; then
            CLIENT_NAME=ws-client.exe
          fi
          go build -ldflags="-s -w -X main.Version=${VERSION}" -o ${CLIENT_NAME} ./cmd/ws-client

      - name: Create release archive
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          ARCHIVE_NAME=llm-proxy-${TAG_NAME}-${{ matrix.os }}-${{ matrix.arch }}

          # 创建目录结构
          mkdir -p ${ARCHIVE_NAME}

          # 复制 proxy 二进制
          BINARY_NAME=proxy
          if [ "${{ matrix.os }}" = "windows" ]; then
            BINARY_NAME=proxy.exe
          fi
          cp ${BINARY_NAME} ${ARCHIVE_NAME}/proxy

          # 复制 ws-client 二进制
          CLIENT_NAME=ws-client
          if [ "${{ matrix.os }}" = "windows" ]; then
            CLIENT_NAME=ws-client.exe
          fi
          cp ${CLIENT_NAME} ${ARCHIVE_NAME}/ws-client

          # 复制配置文件和文档
          cp config.example.yaml ${ARCHIVE_NAME}/
          cp configs/client-config.example.yaml ${ARCHIVE_NAME}/ 2>/dev/null || true
          cp README.md ${ARCHIVE_NAME}/
          cp CHANGELOG.md ${ARCHIVE_NAME}/
          cp LICENSE ${ARCHIVE_NAME}/ 2>/dev/null || true

          # 创建压缩包
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -r ${ARCHIVE_NAME}.zip ${ARCHIVE_NAME}
            sha256sum ${ARCHIVE_NAME}.zip > ${ARCHIVE_NAME}.zip.sha256
            echo "ARTIFACT_NAME=${ARCHIVE_NAME}.zip" >> $GITHUB_ENV
          else
            tar -czvf ${ARCHIVE_NAME}.tar.gz ${ARCHIVE_NAME}
            sha256sum ${ARCHIVE_NAME}.tar.gz > ${ARCHIVE_NAME}.tar.gz.sha256
            echo "ARTIFACT_NAME=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ARTIFACT_NAME }}*
          retention-days: 1

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            acshmily/llm-proxy:${{ steps.tag.outputs.TAG_NAME }}
            acshmily/llm-proxy:latest
          cache-from: type=registry,ref=acshmily/llm-proxy:buildcache
          cache-to: type=registry,ref=acshmily/llm-proxy:buildcache,mode=max

  release:
    runs-on: ubuntu-latest
    needs: [build, docker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: "*"
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "=== Downloaded Artifacts ==="
          find ./artifacts -type f | sort

      - name: Create SHA256 checksums file
        run: |
          cd ./artifacts
          echo "=== SHA256 Checksums ===" > SHA256SUMS
          for f in *.tar.gz *.zip; do
            if [ -f "$f" ]; then
              cat "${f}.sha256" >> SHA256SUMS
              echo "" >> SHA256SUMS
            fi
          done
          cat SHA256SUMS

      - name: Create release notes
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          ## LLM Proxy ${{ steps.tag.outputs.TAG_NAME }}

          ### 🚀 更新内容

          #### 核心功能
          - 多平台二进制文件（Linux, macOS, Windows）
          - 支持 AMD64 和 ARM64 架构
          - Docker 多架构镜像（linux/amd64, linux/arm64）
          - 完整的路由表认证和协议转换

          #### v0.3.0 新增
          - **WebSocket 隧道客户端** (ws-client)
            - 本地 HTTP 代理服务器，无需修改应用代码
            - 自动重连 + 心跳保持
            - 健康检查端点

          ### 📦 安装方式

          #### Docker (推荐 - 服务端)
          ```bash
          docker pull acshmily/llm-proxy:${{ steps.tag.outputs.TAG_NAME }}

          docker run -d \
            -p 8080:8080 \
            -v $(pwd)/config.yaml:/app/config.yaml \
            --name llm-proxy \
            acshmily/llm-proxy:${{ steps.tag.outputs.TAG_NAME }}
          ```

          #### 二进制文件（服务端 + 客户端）

          下载对应平台的压缩包，解压后运行：

          **服务端：**
          ```bash
          cp config.example.yaml config.yaml
          # 编辑 config.yaml 填入 API 密钥
          ./proxy -config config.yaml
          ```

          **WebSocket 隧道客户端（可选）：**
          ```bash
          cp configs/client-config.example.yaml client-config.yaml
          # 编辑 client-config.yaml 填入服务端地址
          ./ws-client --config client-config.yaml
          ```

          **命令行参数：**
          ```bash
          # Linux/macOS
          ./ws-client --server ws://your-server:8080/ws-tunnel --listen :8081

          # Windows
          ws-client.exe --server ws://your-server:8080/ws-tunnel --listen :8081
          ```

          **支持的平台：**
          - Linux (AMD64, ARM64)
          - macOS (AMD64, ARM64)
          - Windows (AMD64, ARM64)

          #### 校验文件
          使用 `SHA256SUMS` 文件验证下载完整性：
          ```bash
          sha256sum -c SHA256SUMS
          ```

          ### 🔄 支持的后端
          - OpenAI (兼容格式)
          - Anthropic (Claude)
          - Google Gemini

          ### 📚 文档
          - [README.md](https://github.com/acshmily/llm-proxy/blob/main/README.md) - 主文档
          - [CONTRIBUTING.md](https://github.com/acshmily/llm-proxy/blob/main/CONTRIBUTING.md) - 贡献指南
          - [CHANGELOG.md](https://github.com/acshmily/llm-proxy/blob/main/CHANGELOG.md) - 变更日志
          - [ws-client-guide.md](https://github.com/acshmily/llm-proxy/blob/main/docs/ws-client-guide.md) - 客户端使用指南
          EOF
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.tag.outputs.TAG_NAME }}
          body_path: RELEASE_NOTES.md
          files: |
            ./artifacts/*.tar.gz
            ./artifacts/*.zip
            ./artifacts/SHA256SUMS
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
